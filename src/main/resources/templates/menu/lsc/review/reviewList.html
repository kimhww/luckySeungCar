<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">
<head>
    <meta charset="UTF-8">
    <title>럭키승카 정비소 - 리뷰</title>
    <link th:inline="css" th:href="|@{/lib/css/menu/lsc/reserve/reserve.css}|" rel="stylesheet"/>
</head>
<body>
<div layout:fragment="Content" class="container">
    <div class="content-box-table">
        <div class="emoji">
            <span class="star"><img th:src="@{/lib/img/star.svg}" class="starImg" alt="별"></span>
            <span class="wrench"><img th:src="@{/lib/img/wrench.svg}" class="wrenchImg" alt="렌치"></span>
        </div>

        <h2 class="resv-title">럭키승카 정비소 [리뷰내역]</h2>

        <p th:if="${#lists.isEmpty(reviewList)}">작성한 리뷰가 없습니다.</p>

        <!-- 카드형 리뷰 목록 -->
        <div class="card-grid">
            <div th:each="revw : ${reviewList}" class="reserve-card"
                 th:data-url="@{/menu/lsc/review/reviewDetail(revwSqnc=${revw.revwSqnc})}"
                 onclick="location.href=this.dataset.url">
                <div><strong>예약날짜:</strong> <span th:text="${revw.resvDate}"></span></div>
                <div><strong>차브랜드:</strong> <span th:text="${revw.carrBrnd}"></span></div>
                <div><strong>차모델:</strong> <span th:text="${revw.carrModl}"></span></div>
                <div><strong>평점:</strong> <span th:text="|${revw.revwScor} / 10|"></span></div>
                <div><strong>작성일:</strong> <span th:text="${#dates.format(revw.workDate, 'yyyy-MM-dd')}"></span></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
